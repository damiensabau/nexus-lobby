name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restauration
        run: dotnet restore VpnClient.sln

      - name: Compilation
        run: dotnet build VpnClient.sln -c Release --no-restore -warnaserror

      - name: Tests
        run: dotnet test tests/VpnClient.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultats-tests
          path: tests/VpnClient.Tests/TestResults/*.trx
